<style>
/* Layout: cabecera fija con pestañas; el trabajo diario ocurre en "Casos" (tarjetas editables); el resto son vistas de lectura. */
:root{
  --bg:#f3f6f9; --card:#ffffff; --ink:#1d2433; --mut:#5d6779; --line:#e1e7ee;
  --brand:#0091cf; --brand-ink:#005f88; --navy:#1a274c; --soft:#e6f4fb;
  --crit:#c9372f; --crit-bg:#fbe9e7; --aten:#a86a00; --aten-bg:#fdf1d9; --ok:#1f8f55; --ok-bg:#e3f4ea;
  --hist:#6b7487; --hist-bg:#eceff4; --chart2:#1a274c; --focus:#0091cf;
  --fd:'Montserrat','Avenir Next',Avenir,Helvetica,Arial,sans-serif; --fb:'Nunito Sans','Avenir Next',Avenir,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1624; --card:#172033; --ink:#e8edf6; --mut:#9aa6bd; --line:#27324a;
  --brand:#38b6ea; --brand-ink:#7fd0f3; --navy:#cfe0ff; --soft:#16324a;
  --crit:#ff8a80; --crit-bg:#3a1f23; --aten:#f0b95a; --aten-bg:#3a2f17; --ok:#62d392; --ok-bg:#163326;
  --hist:#9aa6bd; --hist-bg:#222c42; --chart2:#cfe0ff; --focus:#38b6ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1624; --card:#172033; --ink:#e8edf6; --mut:#9aa6bd; --line:#27324a;
  --brand:#38b6ea; --brand-ink:#7fd0f3; --navy:#cfe0ff; --soft:#16324a;
  --crit:#ff8a80; --crit-bg:#3a1f23; --aten:#f0b95a; --aten-bg:#3a2f17; --ok:#62d392; --ok-bg:#163326;
  --hist:#9aa6bd; --hist-bg:#222c42; --chart2:#cfe0ff; --focus:#38b6ea; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:1060px;margin:0 auto;padding-block:16px 48px}
h1,h2,h3{font-family:var(--fd);color:var(--navy);margin:0;text-wrap:balance}
h1{font-size:20px;font-weight:700} h2{font-size:16px;font-weight:700;margin-bottom:10px} h3{font-size:14px;font-weight:600}
header.top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:12px}
.logo{height:34px;width:auto;background:#fff;border-radius:6px;padding:3px 6px}
.upd{color:var(--mut);font-size:13px}
.schips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.schips button{font:600 13px var(--fb);padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.schips button b{margin-left:4px;color:var(--mut)}.schips button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}.schips button[aria-pressed="true"] b{color:#fff}
.filters label.srch{flex:1 1 260px;min-width:220px}.filters label.srch input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
nav.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
nav.tabs button{font:600 14px var(--fb);padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
nav.tabs button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--mut)} .kpi .v{font:700 26px var(--fd);color:var(--brand-ink);font-variant-numeric:tabular-nums} .kpi .s{font-size:12.5px;color:var(--mut)}
.kpi.alert .v{color:var(--crit)}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.p-critico{background:var(--crit-bg);color:var(--crit)} .p-atencion{background:var(--aten-bg);color:var(--aten)} .p-ok{background:var(--ok-bg);color:var(--ok)} .p-hist{background:var(--hist-bg);color:var(--hist)}
.p-nuevo{background:var(--soft);color:var(--brand-ink)} .p-gestion{background:var(--aten-bg);color:var(--aten)} .p-cerrado{background:var(--ok-bg);color:var(--ok)} .p-descartado{background:var(--hist-bg);color:var(--hist)} .p-venc{background:var(--crit);color:#fff}
.chip{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--hist-bg);color:var(--mut);font-size:12.5px;margin:0 4px 4px 0}
.mut{color:var(--mut);font-size:13px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mut);gap:3px}
select,textarea,input[type=text]{font:14px var(--fb);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:54px}
button.btn{font:700 14px var(--fb);background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.btn.sec{background:var(--hist-bg);color:var(--ink)}
button.btn:disabled,select:disabled,textarea:disabled{opacity:.55;cursor:not-allowed}
.case{border:1px solid var(--line);border-left-width:5px;border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--card);min-width:0}
.case.critico{border-left-color:var(--crit)} .case.atencion{border-left-color:var(--aten)}
.case.venc{box-shadow:0 0 0 1px var(--crit) inset}
.chead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.ctitle{font-weight:700;min-width:0;overflow-wrap:anywhere}
.ctext{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.ctext.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:8px;align-items:end}
.ctrl label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mut);gap:3px;min-width:0}
.ctrl .wide{grid-column:1/-1}
.link{background:none;border:0;color:var(--brand-ink);font:600 13px var(--fb);cursor:pointer;padding:0;text-decoration:underline}
.sc{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.sc span{font-size:12px;background:var(--hist-bg);border-radius:6px;padding:1px 7px;color:var(--mut)} .sc span.low{background:var(--crit-bg);color:var(--crit);font-weight:700}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 12px var(--fd);text-align:left;color:var(--mut);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top} .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ch{width:100%;height:auto;display:block} .ch text{fill:var(--mut);font:11px var(--fb)} .ch .v{fill:var(--ink);font-weight:700}
.ch .grid{stroke:var(--line)} .bar-row{display:grid;grid-template-columns:minmax(110px,170px) 1fr 70px;gap:8px;align-items:center;margin:6px 0;font-size:13.5px}
.bar-row .t{height:10px;background:var(--hist-bg);border-radius:5px;overflow:hidden} .bar-row .t i{display:block;height:100%;background:var(--brand);border-radius:5px}
.up{color:var(--ok);font-weight:700} .dn{color:var(--crit);font-weight:700}
.empty{padding:22px;text-align:center;color:var(--mut)}
.note{background:var(--soft);border-radius:8px;padding:8px 12px;font-size:13.5px;margin-bottom:12px}
details.resp summary{cursor:pointer;font-weight:600;color:var(--brand-ink)}
.rlist{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.rlist .chip button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:14px;padding:0 0 0 6px}
@media (prefers-reduced-motion:no-preference){.case{transition:box-shadow .15s}}
.tip{position:fixed;z-index:50;background:#1a274c;color:#fff;font-size:12.5px;line-height:1.4;border-radius:8px;padding:7px 10px;pointer-events:none;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}
[data-tip]{cursor:pointer}.ch g[data-tip]:hover rect.bar{filter:brightness(1.12)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}.seg button{font:600 13px var(--fb);padding:6px 12px;border:0;background:var(--card);color:var(--ink);cursor:pointer}.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.sug{background:var(--soft);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:13.5px}.sug b{color:var(--brand-ink)}.sug div{margin:2px 0}
.own{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:4px 0}.own b{color:var(--ink);font-weight:600}
.p-comercial{background:#e6f4fb;color:var(--brand-ink)}.p-operativo{background:var(--aten-bg);color:var(--aten)}.p-mixto{background:var(--hist-bg);color:var(--ink)}.p-definir{background:var(--hist-bg);color:var(--hist)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.ch .hit{fill:transparent}
</style>

<script>
(function(){
'use strict';
var TABS=[['casos','Casos'],['hoy','Hoy'],['semana','Semana'],['acumulado','Acumulado'],['equipo','Equipo']];
var ESTADOS=['Nuevo','En gestión','Cerrado','Descartado'];
var RECORDATORIO_DIAS=3;
var TIPOL={comercial:'Comercial',operativo:'Operativo',mixto:'Mixto',definir:'Por definir'};
var S={stats:null,rows:null,resp:[],cases:[],surveys:[],tab:'casos',f:{q:'',estado:'abiertos',sev:'todos',resp:'todos',tipo:'todos',co:'',ej:'',se:'',wk:''},g:{co:'',ej:'',se:'',per:'sem',rango:'12',q:'nps'},open:{},drafts:{},canWrite:null,me:null,names:{},db:null,loaded:{stats:false,cases:false},saving:{}};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n,d){if(n==null||isNaN(n))return '—';return Number(n).toFixed(d==null?1:d).replace('.',',')}
function fdate(iso){if(!iso)return '—';var p=String(iso).slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function fdm(iso){var p=String(iso).slice(0,10).split('-');return p[2]+'/'+p[1]}
function fts(iso){try{return new Date(iso).toLocaleString('es-CO',{timeZone:'America/Bogota',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function bdays(fromIso){var p=String(fromIso).slice(0,10).split('-');var a=new Date(+p[0],+p[1]-1,+p[2]);var b=new Date();b.setHours(0,0,0,0);var n=0;while(a<b){a.setDate(a.getDate()+1);var w=a.getDay();if(w!==0&&w!==6)n++}return n}
var SEVL={critico:'Crítico',atencion:'Atención',ok:'Normal'};
var ESTC={'Nuevo':'p-nuevo','En gestión':'p-gestion','Cerrado':'p-cerrado','Descartado':'p-descartado','Histórico':'p-hist'};
function isOpen(c){return c.estado==='Nuevo'||c.estado==='En gestión'}
function isOverdue(c){return isOpen(c)&&bdays(c.detectado||c.fecha)>=RECORDATORIO_DIAS}
function pname(id){return id?(/^u_/.test(id)?'Alguien del equipo':id):''}
function schedule(){if(schedule.t)return;schedule.t=requestAnimationFrame(function(){schedule.t=0;render()})}
function selOpts(list,cur,all){return '<option value="">'+all+'</option>'+list.map(function(n){return '<option value="'+esc(n)+'"'+(cur===n?' selected':'')+'>'+esc(n)+'</option>'}).join('')}
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function wkey(iso){var p=iso.slice(0,10).split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function wend(k){var p=k.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+6);return ymd(d)}
function pkey(iso,per){if(per==='mes')return iso.slice(0,7);if(per==='tri')return iso.slice(0,4)+'-T'+(Math.floor((+iso.slice(5,7)-1)/3)+1);return wkey(iso)}
function plabel(k,per){if(per==='mes')return k.slice(5)+'/'+k.slice(2,4);if(per==='tri')return k.slice(5)+' '+k.slice(2,4);return fdm(k)}
function pfull(k,per){if(per==='mes')return 'Mes '+k.slice(5)+'/'+k.slice(0,4);if(per==='tri')return 'Trimestre '+k.slice(5)+' '+k.slice(0,4);return 'Semana del '+fdm(k)+' al '+fdm(wend(k))}

/* ---------- datos filtrados ---------- */
function frows(){var D=S.rows;if(!D)return [];return D.rows.filter(function(r){
  if(S.g.co&&D.co[r.co]!==S.g.co)return false;if(S.g.ej&&D.ej[r.ej]!==S.g.ej)return false;if(S.g.se&&D.se[r.se]!==S.g.se)return false;return true})}
function agg(a){var n=a.length,p=0,d=0,gs=0,gn=0,cr=0,at=0,q=[0,0,0,0,0,0,0],qn=[0,0,0,0,0,0,0];
  a.forEach(function(r){if(r.n!=null){if(r.n>=9)p++;else if(r.n<=6)d++}if(r.g!=null){gs+=r.g;gn++}if(r.s===2)cr++;if(r.s===1)at++;(r.q||[]).forEach(function(v,i){if(v!=null){q[i]+=v;qn[i]++}})});
  var nn=a.filter(function(r){return r.n!=null}).length;
  return {n:n,nps:nn?(p-d)/nn*100:null,gen:gn?gs/gn:null,crit:cr,aten:at,q:q.map(function(v,i){return qn[i]?v/qn[i]:null})}}
function groupBy(a,per){var m={};a.forEach(function(r){var k=pkey(r.f,per);(m[k]=m[k]||[]).push(r)});return Object.keys(m).sort().map(function(k){return Object.assign({k:k,rows:m[k]},agg(m[k]))})}
function delta(a,b,d,inv){if(a==null||b==null)return '';var x=a-b;if(Math.abs(x)<0.005)return '<span class="mut">sin cambio</span>';var good=inv?x<0:x>0;return '<span class="'+(good?'up':'dn')+'">'+(x>0?'▲ ':'▼ ')+fmt(Math.abs(x),d)+'</span>'}
function kpi(l,v,s,alert){return '<div class="kpi'+(alert?' alert':'')+'"><div class="l">'+esc(l)+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div>'}
function nrange(vals){var v=vals.filter(function(x){return x!=null});var mn=v.length?Math.min.apply(null,v):50;return Math.min(60,Math.floor((mn-10)/10)*10)}
function movil(gs,i,w){var a=[];for(var j=Math.max(0,i-w+1);j<=i;j++)a=a.concat(gs[j].rows);return agg(a)}

/* ---------- gráficos SVG con detalle al pasar el cursor ---------- */
function tipAttr(t){return ' data-tip="'+esc(t)+'" tabindex="0"'}
function bars(g,per,opt){opt=opt||{};var W=520,H=150,n=g.length,mx=Math.max.apply(null,g.map(function(x){return x.n}).concat([1])),bw=(W-24)/n,o='<svg class="ch" viewBox="0 0 '+W+' '+(H+28)+'" role="img" aria-label="'+esc(opt.aria||'Encuestas por periodo')+'">';
  g.forEach(function(x,i){var h=x.n/mx*(H-26),xx=12+i*bw,y=H-h,tt=pfull(x.k,per)+'\nEncuestas: '+x.n+'\nNPS: '+fmt(x.nps,0)+' · Satisfacción: '+fmt(x.gen,2)+'\nCríticos: '+x.crit+' · Atención: '+x.aten+(x.n<5?'\n(pocas respuestas)':'')+(per==='sem'?'\nClic: ver los casos de la semana':'');

  var h=ctl(false)+'<div class="kpis">'+kpi('Encuestas (desde dic. 2025)',t.n,'2026: '+y.n,false)+kpi('NPS acumulado',fmt(t.nps),'2026: '+fmt(y.nps),false)+kpi('Satisfacción',fmt(t.gen,2),'2026: '+fmt(y.gen,2),false)+kpi('Casos críticos',t.crit,'atención: '+t.aten,false)+'</div>';
  h+='<div class="kpis">'+kpi('Casos con seguimiento',cs.length,'detectados con este tablero',false)+kpi('Cerrados',cs.length?fmt(cl.length/cs.length*100,0)+'%':'—',cl.length+' de '+cs.length,false)+kpi('Días promedio de cierre',avgd==null?'—':fmt(avgd,1),'desde la detección',false)+'</div>';
  var m=groupBy(rw,'mes');
  h+='<div class="cols"><div class="card"><h2>NPS por mes</h2>'+line(m,'mes',function(x){return x.nps},nrange(m.map(function(x){return x.nps})),100,{label:'NPS'})+'<div class="mut">Meses con pocas encuestas son poco representativos.</div></div>'
   +'<div class="card"><h2>Encuestas y casos por mes</h2>'+bars(m,'mes')+'</div></div>';
  var tri=groupBy(rw,'tri');
  var th={};rw.forEach(function(r){if(r.s>0&&r.f>='2026-01-01')(r.t.length?r.t:[-1]).forEach(function(i){var k=i<0?'Sin clasificar':D.temas[i];var d=th[k]=th[k]||{total:0,crit:0};d.total++;if(r.s===2)d.crit++})});
  var ks=Object.keys(th).sort(function(a,b){return th[b].total-th[a].total}),mx=ks.length?th[ks[0]].total:0;
  h+='<div class="cols"><div class="card"><h2>Trimestres</h2><div class="scroll"><table><tr><th>Trimestre</th><th class="num">Enc.</th><th class="num">NPS</th><th class="num">Satisf.</th><th class="num">Críticos</th></tr>'+tri.map(function(x){return '<tr><td>'+esc(plabel(x.k,'tri'))+'</td><td class="num">'+x.n+'</td><td class="num">'+fmt(x.nps)+'</td><td class="num">'+fmt(x.gen,2)+'</td><td class="num">'+x.crit+'</td></tr>'}).join('')+'</table></div></div>'
   +'<div class="card"><h2>Temas en casos críticos y de atención (2026)</h2>'+hbars(ks.map(function(k){return [k,th[k].total,th[k].total+' ('+th[k].crit+' crít.)']}),mx,'')+'<div class="mut">Un caso puede tener varios temas. Clasificación automática por palabras clave.</div></div></div>';
  var cm={};rw.filter(function(r){return r.f>='2026-01-01'}).forEach(function(r){var d=cm[r.cl]=cm[r.cl]||{n:0,s:[],a:0};d.n++;d.s.push(r);if(r.s>0)d.a++});
  var cls=Object.keys(cm).sort(function(a,b){return cm[b].n-cm[a].n}).slice(0,10);
  h+='<div class="cols"><div class="card"><h2>Calificación por pregunta (acumulado)</h2>'+hbars((D.qlabels||[]).map(function(l,i){return [l,(t.q[i]||0)-4,fmt(t.q[i],2)]}),1,'')+'<div class="mut">Barras desde 4,0 hasta 5,0 para que se note la diferencia.</div></div>'
   +'<div class="card"><h2>Clientes con más encuestas (2026)</h2><div class="scroll"><table><tr><th>Cliente</th><th class="num">Enc.</th><th class="num">NPS</th><th class="num">Alertas</th></tr>'+cls.map(function(k){return '<tr><td>'+esc(k)+'</td><td class="num">'+cm[k].n+'</td><td class="num">'+fmt(agg(cm[k].s).nps,0)+'</td><td class="num">'+cm[k].a+'</td></tr>'}).join('')+'</table></div></div></div>';
  h+='<div class="card"><h2>Reglas de alerta</h2><div class="mut">'+esc((S.stats&&S.stats.reglas)||'')+' Un caso vence a los '+RECORDATORIO_DIAS+' días hábiles sin cerrarse.</div></div>';
  return h}
function equipoTabla(titulo,key,list,field){
  var D=S.rows,rw=D.rows.filter(function(r){return r.f>='2026-01-01'});
  var rows=list.map(function(nm,i){var a=rw.filter(function(r){return r[key]===i}),g=agg(a),cs=S.cases.filter(function(c){return c.estado!=='Histórico'&&c[field]===nm});
    return {nm:nm,n:g.n,nps:g.nps,gen:g.gen,casos:cs.length,ab:cs.filter(isOpen).length,ven:cs.filter(isOverdue).length,cer:cs.filter(function(c){return c.estado==='Cerrado'||c.estado==='Descartado'}).length}}).filter(function(x){return x.n>0}).sort(function(a,b){return b.n-a.n});
  return '<div class="card"><h2>'+titulo+'</h2><div class="scroll"><table><tr><th>Nombre</th><th class="num">Enc. 2026</th><th class="num">NPS</th><th class="num">Satisf.</th><th class="num">Casos</th><th class="num">Abiertos</th><th class="num">Vencidos</th><th class="num">Cerrados</th></tr>'
   +rows.map(function(x){return '<tr><td>'+esc(x.nm)+'</td><td class="num">'+x.n+'</td><td class="num">'+fmt(x.nps,0)+'</td><td class="num">'+fmt(x.gen,2)+'</td><td class="num">'+x.casos+'</td><td class="num">'+x.ab+'</td><td class="num"'+(x.ven?' style="color:var(--crit);font-weight:700"':'')+'>'+x.ven+'</td><td class="num">'+x.cer+'</td></tr>'}).join('')+'</table></div></div>'}
function vEquipo(){

/* ---------- render ---------- */
function render(){
  var tb=$('tabs');tb.innerHTML=TABS.map(function(t){return '<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+'</button>'}).join('');

  var act=document.activeElement,keep=act&&act.getAttribute&&act.closest&&act.closest('.case')?{id:act.closest('.case').getAttribute('data-id'),f:act.getAttribute('data-f'),pos:act.selectionStart}:null;

  else if(fid){var e2=$(fid);if(e2)e2.focus()}
  if(!S.stats&&S.loaded.stats)$('msg').innerHTML='<div class="note">Todavía no hay indicadores publicados. Aparecerán después de la primera actualización diaria.</div>';else $('msg').innerHTML=''}

/* ---------- detalle al pasar el cursor ---------- */
function hideTip(){var t=$('tip');if(t)t.style.display='none'}
function showTip(el,x,y){var t=$('tip');t.innerHTML=esc(el.getAttribute('data-tip')).replace(/\n/g,'<br>');t.style.display='block';var w=t.offsetWidth,h=t.offsetHeight,nx=Math.min(Math.max(8,x+12),window.innerWidth-w-8),ny=y-h-12;if(ny<8)ny=y+16;t.style.left=nx+'px';t.style.top=ny+'px'}
document.addEventListener('mouseover',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY)});
document.addEventListener('mousemove',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else hideTip()});

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-more],[data-save],[data-delresp],#addresp,[data-per],[data-rango],[data-gclear],[data-wk],[data-clearwk],[data-usar],[data-est]');if(!t)return;

  if(t.hasAttribute('data-clearwk')){S.f.wk='';render();return}
  if(t.hasAttribute('data-usar')){var uid=t.getAttribute('data-usar'),c0=S.cases.filter(function(x){return x._id===uid})[0];if(c0){(S.drafts[uid]=S.drafts[uid]||{}).accion=(c0.accionSug||[]).map(function(a){return a.quien+': '+a.texto}).join('\n');render()}return}
  if(t.hasAttribute('data-more')){var id=t.getAttribute('data-more');S.open[id]=!S.open[id];render();return}
  if(t.hasAttribute('data-save')){saveCase(t.getAttribute('data-save'));return}
  if(t.hasAttribute('data-delresp')){var i=+t.getAttribute('data-delresp'),n=(S.resp||[]).slice();n.splice(i,1);saveResp(n);return}
  if(t.id==='addresp'){var inp=$('newresp'),v=(inp.value||'').trim();if(!v)return;var n2=(S.resp||[]).slice();if(n2.indexOf(v)<0)n2.push(v);n2.sort(function(a,b){return a.localeCompare(b,'es')});inp.value='';saveResp(n2)}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-estado'){S.f.estado=t.value;render();return}if(t.id==='f-sev'){S.f.sev=t.value;render();return}if(t.id==='f-resp'){S.f.resp=t.value;render();return}
  if(t.id==='f-tipo'){S.f.tipo=t.value;render();return}if(t.id==='f-co'){S.f.co=t.value;render();return}if(t.id==='f-ej'){S.f.ej=t.value;render();return}if(t.id==='f-se'){S.f.se=t.value;render();return}
  if(t.hasAttribute&&t.hasAttribute('data-g')){S.g[t.getAttribute('data-g')]=t.value;render();return}
  if(t.hasAttribute&&t.hasAttribute('data-q')){S.g.q=t.value;render();return}
  var f=t.getAttribute&&t.getAttribute('data-f');if(!f)return;var card=t.closest('.case');if(!card)return;var id=card.getAttribute('data-id');
  (S.drafts[id]=S.drafts[id]||{})[f]=t.value;if(t.tagName!=='TEXTAREA')render()});
document.addEventListener('input',function(e){var t0=e.target;if(t0&&t0.id==='f-q'){S.f.q=t0.value;clearTimeout(window._qt);window._qt=setTimeout(function(){var p=t0.selectionStart;render();var el=document.getElementById('f-q');if(el){el.focus();try{el.setSelectionRange(p,p)}catch(x){}}},180);return}var t=e.target,f=t.getAttribute&&t.getAttribute('data-f');if(f==='accion'||f==='revision'){var card=t.closest('.case'),id=card.getAttribute('data-id'),first=!(S.drafts[id]&&S.drafts[id][f]!=null);(S.drafts[id]=S.drafts[id]||{})[f]=t.value;if(first){var b=card.querySelector('[data-save]');if(b&&S.canWrite!==false)b.disabled=false}}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='newresp'){e.preventDefault();var b=$('addresp');if(b)b.click()}});

var API='https://rztnyqkweufoyvmajfww.supabase.co/functions/v1/tablero';
var K='';try{K=localStorage.getItem('codigo_tablero')||''}catch(e){}
function post(o){o.c=K;return fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)}).then(function(r){return r.json()})}
function myName(){var n='';try{n=localStorage.getItem('nombre')||''}catch(e){}return n}
function drawWho(){var el=$('who');if(!el)return;var me=myName(),l=(S.resp||[]).slice();if(me&&l.indexOf(me)<0)l.push(me);
  el.innerHTML='Soy: <select id="whoSel" style="font:inherit;font-size:13px"><option value="">Elige tu nombre…</option>'+l.map(function(n){return '<option'+(n===me?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select>'}
document.addEventListener('change',function(e){if(e.target&&e.target.id==='whoSel'){try{localStorage.setItem('nombre',e.target.value)}catch(x){}}});
function flash(id,txt,bad){
  var c=document.querySelector('.case[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');if(!c){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:9';document.body.appendChild(t)}t.style.background=bad?'#fbe9e7':'#e6f4ea';t.style.color=bad?'#c9372f':'#1e6b3a';t.textContent=txt+(bad?'':' El caso ya no aparece en esta vista por su nuevo estado.');setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},4000);return}
  var f=c.querySelector('.flash');if(!f){f=document.createElement('div');f.className='flash';f.style.cssText='margin-top:8px;padding:8px 12px;border-radius:8px;font-size:14px';c.appendChild(f)}
  f.style.background=bad?'var(--crit-bg)':'#e6f4ea';f.style.color=bad?'var(--crit)':'#1e6b3a';f.textContent=txt;f.scrollIntoView({block:'nearest'})}
async function saveCase(id){
  var c=S.cases.filter(function(x){return x._id===id})[0],d=S.drafts[id];if(!c||!d||S.saving[id])return;
  var nom=myName();
  if(!nom){flash(id,'Antes de guardar, elige tu nombre arriba a la derecha, en "Soy".',true);var w=$('whoSel');if(w){w.style.outline='2px solid #c9372f';w.scrollIntoView({block:'center'});w.focus()}return}
  var estado=d.estado!=null?d.estado:c.estado,rsp=d.responsable!=null?d.responsable:(c.responsable||c.comercial||''),acc=d.accion!=null?d.accion:(c.accion||''),rev=d.revision!=null?d.revision:(c.revision||'');
  S.saving[id]=true;render();
  var ok=false;
  try{var j=await post({id:id,nombre:nom,estado:estado,responsable:rsp,accion:acc,revision:rev});ok=!!j.ok;if(ok){delete S.drafts[id];await load(true)}}catch(err){ok=false}
  delete S.saving[id];render();
  flash(id,ok?'Guardado.':'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.',!ok)}
async function saveResp(names){
  var nom=myName()||'Directivo';
  try{var j=await post({nombre:nom,names:names});if(!j.ok)throw 0;S.resp=names;$('msg').innerHTML='';render()}
  catch(err){$('msg').innerHTML='<div class="note" style="background:var(--crit-bg);color:var(--crit)">No se pudo guardar la lista de responsables.</div>'}}

/* ---------- datos ---------- */
function gate(msg){
  $('view').innerHTML='<div class="card" style="max-width:420px;margin:30px auto"><b>Ingresa el código de acceso</b><p class="mut">Es el código del equipo directivo que viene en el correo. Solo se pide la primera vez en este navegador.</p><input type="text" id="codeIn" placeholder="Código" autocomplete="off" style="width:100%;padding:10px;font:inherit;border:1px solid var(--line,#ccc);border-radius:8px"><button type="button" class="btn" id="codeGo" style="margin-top:10px">Entrar</button>'+(msg?'<div class="note" style="margin-top:10px;background:var(--crit-bg);color:var(--crit)">'+esc(msg)+'</div>':'')+'</div>';
  $('codeGo').onclick=function(){var v=($('codeIn').value||'').trim();if(!v)return;K=v;load(false,true)};
  $('codeIn').onkeydown=function(e){if(e.key==='Enter')$('codeGo').click()}}
async function load(quiet,fresh){
  try{var r=await fetch(API+'?c='+encodeURIComponent(K));
    if(r.status===403){K='';try{localStorage.removeItem('codigo_tablero')}catch(e){}gate(fresh?'Código incorrecto. Revisa el correo e inténtalo de nuevo.':'');return}
    var d=await r.json();if(d.rol!=='directivo'){K='';gate('Este código no da acceso al tablero completo.');return}
    try{localStorage.setItem('codigo_tablero',K)}catch(e){}
    S.stats=d.stats;S.rows=d.rows;S.resp=d.resp||[];S.cases=d.cases||[];S.surveys=d.surveys||[];S.loaded.stats=true;S.loaded.cases=true;S.ok=true;drawWho();render()}
  catch(e){if(!quiet)$('upd').textContent='No se pudo conectar con los datos. Recarga la página.'}}
async function start(){
  var h=(location.hash||'').replace('#','');if(TABS.some(function(t){return t[0]===h}))S.tab=h;
  window.addEventListener('hashchange',function(){var x=(location.hash||'').replace('#','');if(TABS.some(function(t){return t[0]===x})&&x!==S.tab){S.tab=x;render()}});
  render();
  if(!K){gate('');return}
  await load();setInterval(function(){if(S.ok&&!document.hidden&&!Object.keys(S.drafts).length)load(true)},120000);
}
start();
})();
